<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQUID: User Intent Discovery</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #f8f9fa; /* Light grey background */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header Styling */
        .squid-header { 
            background: linear-gradient(135deg, #2c3e50 0%, #4ca1af 100%); /* Modern gradient */
            color: white; 
            padding: 1.5rem 0; 
            margin-bottom: 2rem; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .squid-logo {
            font-weight: 800;
            letter-spacing: 1px;
            font-size: 1.8rem;
        }

        /* Footer Styling */
        footer {
            margin-top: auto;
            background-color: #e9ecef;
            padding: 1rem 0;
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
        }

        /* Custom Input Styling (For Search Bar in child templates) */
        .input-group-text { border-right: none; }
        .form-control { border-left: none; }
        .form-control:focus { box-shadow: none; border-color: #ced4da; }
        .input-group:focus-within { 
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25); 
            border-radius: 0.375rem; 
        }
        
        /* Result Card Styling */
        .result-card { border-left: 5px solid #2ecc71; }
        .example-badge { font-size: 0.9em; margin-right: 5px; }
    </style>
</head>
<body>

    <nav class="squid-header">
        <div class="container text-center">
            <div class="squid-logo">🦑 SQUID</div>
            <p class="mb-0 opacity-75">Example-Driven Query Intent Discovery</p>
        </div>
    </nav>

    <div class="container mb-5">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <div class="container">
            SQUID Project &copy; 2025 | Powered by Django & PostgreSQL
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
